<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SELRS — اتجاهات جديدة</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800;900&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Readex+Pro:wght@300;400;500;600;700&family=Rubik:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Cairo,sans-serif;background:#cfd0d6;color:#111}
.ltr{direction:ltr;unicode-bidi:isolate;display:inline-block}
.top{position:sticky;top:0;z-index:50;background:#111;color:#fff;padding:10px 20px;display:flex;flex-wrap:wrap;gap:10px 26px;align-items:center}
.top h1{font-size:15px;font-weight:700}
.seg{display:flex;gap:4px;background:#2a2a2a;padding:4px;border-radius:10px}
.seg button{border:0;background:none;color:#aaa;font:600 13px Cairo;padding:7px 14px;border-radius:7px;cursor:pointer}
.seg button.on{background:#fff;color:#111}
.note{max-width:1320px;margin:16px auto 0;padding:0 20px;font-size:14px;color:#333;line-height:1.8}
.stage{max-width:1320px;margin:12px auto 40px;padding:0 20px}
.frame{border-radius:18px;box-shadow:0 24px 70px rgba(0,0,0,.28);overflow-x:auto}
.app{min-width:1040px;min-height:760px}
button{font-family:inherit;cursor:pointer}

/* ============ A · ضوء — داكن مضيء ============ */
.A{--bg:#06070d;--tx:#eef0ff;--mut:#8b90ad;--v:#7c5cff;--c:#22d3ee;--p:#ff5cb8;--g:rgba(255,255,255,.055);--gb:rgba(255,255,255,.11);
 font-family:"Readex Pro",sans-serif;color:var(--tx);position:relative;overflow:hidden;
 background:radial-gradient(900px 500px at 85% -10%,rgba(124,92,255,.35),transparent 60%),radial-gradient(700px 500px at -5% 105%,rgba(34,211,238,.22),transparent 60%),var(--bg);padding:22px 36px 40px}
.A .dock{width:max-content;margin:0 auto 34px;display:flex;gap:4px;align-items:center;background:var(--g);border:1px solid var(--gb);backdrop-filter:blur(14px);padding:6px;border-radius:99px}
.A .dock b{font:700 15px "Readex Pro";padding:8px 18px;background:linear-gradient(135deg,var(--v),var(--c));border-radius:99px;color:#fff;margin-inline-end:6px}
.A .dock a{padding:8px 18px;border-radius:99px;font-size:14px;color:var(--mut)}
.A .dock a.on{background:rgba(255,255,255,.12);color:#fff}
.A .gl{background:var(--g);border:1px solid var(--gb);border-radius:28px;backdrop-filter:blur(12px)}
.A h1{font-weight:300;font-size:48px;line-height:1.15;letter-spacing:0}
.A h1 b{font-weight:600;background:linear-gradient(90deg,var(--c),var(--v));-webkit-background-clip:text;color:transparent}
.A .mut{color:var(--mut);font-size:14px}
.A .orb{display:grid;grid-template-columns:1fr 360px 1fr;gap:24px;align-items:center;margin-bottom:28px}
.A .iris{position:relative;width:340px;height:340px;margin:auto}
.A .iris svg{position:absolute;inset:0}
.A .iris .core{position:absolute;inset:78px;border-radius:50%;background:radial-gradient(circle,#0b0d1a 28%,rgba(124,92,255,.3) 100%);display:grid;place-items:center;text-align:center;box-shadow:0 0 70px rgba(124,92,255,.45)}
.A .iris .core b{font:200 76px/1 "Readex Pro"}.A .iris .core span{font-size:13px;color:var(--mut)}
.A .side{display:flex;flex-direction:column;gap:14px}
.A .stat{padding:18px 22px;display:flex;justify-content:space-between;align-items:center}
.A .stat span{color:var(--mut);font-size:14px}.A .stat b{font:300 38px "Readex Pro"}
.A .stat i{width:8px;height:8px;border-radius:50%;background:var(--k);box-shadow:0 0 12px var(--k);margin-inline-end:10px;display:inline-block}
.A .mods{display:grid;grid-template-columns:repeat(6,1fr);gap:12px}
.A .m{padding:18px 16px;display:flex;flex-direction:column;gap:12px;min-height:118px;justify-content:space-between;transition:.2s}
.A .m:hover{background:rgba(124,92,255,.18);border-color:rgba(124,92,255,.5)}
.A .m b{font-weight:500;font-size:15px}.A .m span{font-size:12px;color:var(--mut)}
.A .m .dot{width:34px;height:34px;border-radius:12px;background:linear-gradient(135deg,var(--v),var(--c));opacity:.9}
.A .tl{display:grid;grid-template-columns:90px 1fr;gap:0 20px}
.A .tl .h{font:300 14px "IBM Plex Mono";color:var(--mut);text-align:end;padding-top:14px;direction:ltr}
.A .tl .sl{border-inline-start:1px solid var(--gb);padding:6px 24px 6px 0;padding-inline-start:24px;position:relative;min-height:84px}
.A .tl .sl:before{content:"";position:absolute;inset-inline-start:-5px;top:20px;width:9px;height:9px;border-radius:50%;background:var(--k,var(--gb));box-shadow:0 0 12px var(--k,transparent)}
.A .ev{display:flex;gap:18px;align-items:center;padding:16px 22px;border-radius:22px}
.A .ev b{font-weight:500;font-size:17px;display:block}.A .ev small{color:var(--mut);font-size:13px}
.A .ev .sp{margin-inline-start:auto;display:flex;gap:10px;align-items:center}
.A .tg{font-size:12px;padding:4px 12px;border-radius:99px;border:1px solid var(--k);color:var(--k)}
.A .acts{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:26px}
.A .acts span{padding:9px 16px;border-radius:99px;border:1px solid var(--gb);font-size:13px;color:var(--mut);background:var(--g)}
.A .acts span.p{background:linear-gradient(135deg,var(--v),var(--c));border:0;color:#fff;font-weight:600}
.A .eyes{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin:30px 0}
.A .eye{padding:30px;text-align:center;position:relative}
.A .eye .lens{width:200px;height:200px;border-radius:50%;margin:0 auto 18px;display:grid;place-items:center;background:radial-gradient(circle,#06070d 30%,var(--k) 150%);box-shadow:0 0 60px color-mix(in srgb,var(--k) 55%,transparent),inset 0 0 0 1px rgba(255,255,255,.2)}
.A .eye .lens b{font:200 56px "Readex Pro";direction:ltr}.A .eye h3{font-weight:500;margin-bottom:12px}
.A .eye table{margin:auto;font:400 15px "IBM Plex Mono";direction:ltr;border-collapse:collapse}.A .eye td,.A .eye th{padding:6px 16px;color:#dfe2ff}.A .eye th{color:var(--mut);font-weight:400;font-size:11px}
.A .sec{display:flex;gap:10px;flex-wrap:wrap}
.A .sec span{padding:10px 20px;border-radius:99px;background:var(--g);border:1px solid var(--gb);font-size:14px;color:var(--mut)}.A .sec span.on{background:#fff;color:#06070d;font-weight:600}

/* ============ B · دفء — ناعم عضوي ============ */
.B{--bg:#f1e8da;--cream:#fbf6ec;--sage:#5f7f6b;--sage2:#dbe6d9;--clay:#c9623a;--clay2:#f4d9c9;--sand:#e6d5b8;--ink:#2d2823;--mut:#7d7366;
 font-family:"Readex Pro",sans-serif;background:var(--bg);color:var(--ink);padding:28px 40px 110px;position:relative}
.B .hi{display:flex;align-items:center;gap:16px;margin-bottom:24px}
.B .hi .av{width:54px;height:54px;border-radius:50%;background:var(--clay);color:#fff;display:grid;place-items:center;font-weight:600;font-size:20px}
.B .hi h1{font-weight:500;font-size:30px;line-height:1.3}.B .hi p{color:var(--mut);font-size:14px}
.B .hi .sp{margin-inline-start:auto;background:var(--cream);padding:10px 18px;border-radius:99px;font-size:14px}
.B .dock{position:absolute;bottom:26px;left:50%;transform:translateX(-50%);display:flex;gap:6px;background:var(--ink);padding:8px;border-radius:99px;box-shadow:0 14px 34px rgba(45,40,35,.35)}
.B .dock a{padding:11px 22px;border-radius:99px;color:#cfc6b6;font-size:14px}.B .dock a.on{background:var(--clay);color:#fff;font-weight:500}
.B .bento{display:grid;grid-template-columns:repeat(6,1fr);grid-auto-rows:110px;gap:14px}
.B .t{border-radius:36px;padding:22px 24px;display:flex;flex-direction:column;justify-content:space-between;background:var(--cream)}
.B .t b{font-weight:500;font-size:17px;display:block}.B .t span{font-size:13px;color:var(--mut)}
.B .t.s{background:var(--sage);color:#fff}.B .t.s span{color:#d4e2d8}
.B .t.c{background:var(--clay);color:#fff}.B .t.c span{color:#fbe3d6}
.B .t.d{background:var(--sand)}.B .t.g{background:var(--sage2)}.B .t.p{background:var(--clay2)}
.B .t .n{font:300 64px/1 "Readex Pro"}
.B .w2{grid-column:span 2}.B .w3{grid-column:span 3}.B .w4{grid-column:span 4}.B .h2{grid-row:span 2}.B .h3{grid-row:span 3}
.B .days{display:flex;gap:10px;margin-bottom:22px}
.B .days div{background:var(--cream);border-radius:24px;padding:12px 20px;text-align:center;min-width:76px}
.B .days div.on{background:var(--sage);color:#fff}.B .days small{display:block;font-size:12px;opacity:.7}.B .days b{font:500 22px "Readex Pro"}
.B .chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}
.B .chips span{background:var(--cream);border-radius:99px;padding:10px 18px;font-size:13.5px}.B .chips span.p{background:var(--clay);color:#fff}
.B .lst{display:flex;flex-direction:column;gap:12px}
.B .pc{background:var(--cream);border-radius:34px;padding:16px 22px;display:grid;grid-template-columns:64px 1fr auto auto;gap:20px;align-items:center}
.B .pc .a{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;font-weight:600;font-size:20px;background:var(--k);color:#fff}
.B .pc b{font-weight:500;font-size:18px;display:block}.B .pc small{color:var(--mut);font-size:13px}
.B .pc .tm{font:400 15px "IBM Plex Mono";color:var(--mut)}
.B .st{border-radius:99px;padding:7px 18px;font-size:13px;background:var(--sage2);color:#35513f}.B .st.o{background:var(--clay2);color:#8a3a18}.B .st.d{background:var(--sand);color:#5b4a2a}
.B .pg{display:grid;grid-template-columns:340px 1fr;gap:16px}
.B .prof{background:var(--sage);color:#fff;border-radius:44px;padding:32px;display:flex;flex-direction:column;gap:14px}
.B .prof .bl{width:120px;height:120px;border-radius:46% 54% 50% 50%/55% 45% 55% 45%;background:var(--clay2);color:var(--clay);display:grid;place-items:center;font:600 48px "Readex Pro"}
.B .prof h2{font-weight:500;font-size:28px;line-height:1.3}.B .prof p{color:#d4e2d8;font-size:14px}
.B .prof .btn{background:var(--cream);color:var(--ink);border:0;border-radius:99px;padding:14px;font:500 15px "Readex Pro";margin-top:auto}
.B .col{display:flex;flex-direction:column;gap:14px}
.B .ey{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.B .eyb{border-radius:40px;padding:24px 28px}.B .eyb h4{font-weight:500;font-size:14px;opacity:.75}
.B .eyb b{display:block;font:300 32px "Readex Pro";direction:ltr;text-align:start;margin:8px 0}
.B .secs{display:flex;gap:10px;flex-wrap:wrap}.B .secs span{background:var(--cream);padding:12px 20px;border-radius:99px;font-size:14px}.B .secs span.on{background:var(--ink);color:#fff}

/* ============ C · صارم — طباعي سويسري ============ */
.C{--k:#0a0a0a;--r:#ff3b1f;--w:#fff;--g:#e8e8e8;--m:#6b6b6b;font-family:"IBM Plex Sans Arabic",sans-serif;background:var(--w);color:var(--k)}
.C .bar{display:grid;grid-template-columns:200px 1fr auto;border-bottom:3px solid var(--k)}
.C .bar .l{font:900 30px Rubik;padding:16px 28px;background:var(--k);color:var(--w);letter-spacing:0}
.C .bar nav{display:flex}.C .bar nav a{padding:22px 24px;font-weight:700;font-size:15px;border-inline-end:1px solid var(--k)}
.C .bar nav a.on{background:var(--r);color:var(--w)}
.C .bar .u{padding:22px 28px;font-size:14px;font-weight:600;border-inline-start:1px solid var(--k)}
.C .hero{display:grid;grid-template-columns:1.1fr 1fr;border-bottom:3px solid var(--k)}
.C .hero .big{padding:34px 36px;border-inline-end:3px solid var(--k)}
.C .hero small{font:600 12px "IBM Plex Mono";color:var(--m);display:block}
.C .num{font:900 200px/.85 Rubik;letter-spacing:-.04em;direction:ltr;text-align:end}
.C .num span{color:var(--r)}
.C .hero h1{font-weight:700;font-size:26px;margin-top:14px}
.C .kv{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr}
.C .kv div{padding:22px 28px;border-bottom:1.5px solid var(--k);border-inline-start:1.5px solid var(--k)}
.C .kv div:nth-child(odd){border-inline-start:0}.C .kv div:nth-last-child(-n+2){border-bottom:0}
.C .kv b{font:900 64px/1 Rubik}.C .kv span{display:block;font-weight:600;font-size:14px;margin-top:6px}
.C .kv .r{background:var(--r);color:var(--w)}
.C .idx{display:grid;grid-template-columns:repeat(2,1fr)}
.C .ix{display:grid;grid-template-columns:70px 1fr auto;align-items:baseline;gap:16px;padding:18px 28px;border-bottom:1.5px solid var(--k);border-inline-start:1.5px solid var(--k);transition:.12s}
.C .ix:nth-child(odd){border-inline-start:0}
.C .ix:hover{background:var(--k);color:var(--w)}
.C .ix i{font:500 14px "IBM Plex Mono";font-style:normal;color:var(--r)}
.C .ix b{font-size:24px;font-weight:700}.C .ix span{font-size:13px;color:var(--m)}.C .ix:hover span{color:#aaa}
.C .ix em{font:400 22px Rubik;font-style:normal}
.C .tools{display:flex;flex-wrap:wrap;border-bottom:3px solid var(--k)}
.C .tools span{padding:14px 20px;border-inline-end:1.5px solid var(--k);font-weight:600;font-size:14px}
.C .tools span.p{background:var(--r);color:var(--w)}
.C table{width:100%;border-collapse:collapse}
.C th{font:600 11px "IBM Plex Mono";text-align:start;padding:10px 28px;border-bottom:3px solid var(--k);background:var(--g);color:var(--m)}
.C td{padding:18px 28px;border-bottom:1.5px solid var(--k);font-size:16px;font-weight:500}
.C td.n{font-size:26px;font-weight:700}
.C td .t{font:700 28px Rubik;direction:ltr;display:inline-block}
.C .sb{display:inline-block;padding:4px 14px;font-weight:700;font-size:13px;border:2px solid var(--k)}
.C .sb.r{background:var(--r);border-color:var(--r);color:var(--w)}.C .sb.k{background:var(--k);color:var(--w)}
.C tr.done td{color:#9a9a9a}
.C .pg{display:grid;grid-template-columns:1fr 1.2fr}
.C .pl{background:var(--k);color:var(--w);padding:36px;display:flex;flex-direction:column;gap:20px}
.C .pl small{font:500 12px "IBM Plex Mono";color:#999}
.C .pl h1{font-weight:700;font-size:60px;line-height:1.1}
.C .pl .m{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:#444;margin-top:auto}
.C .pl .m div{background:var(--k);padding:14px 0}.C .pl .m span{display:block;color:#999;font-size:12px}.C .pl .m b{font:500 18px "IBM Plex Mono";direction:ltr;display:inline-block}
.C .pl .btn{background:var(--r);border:0;color:var(--w);font:800 18px Cairo;padding:18px}
.C .pr .eye{padding:26px 36px;border-bottom:3px solid var(--k);display:grid;grid-template-columns:90px 1fr;gap:16px;align-items:center}
.C .pr .eye h4{font:900 54px Rubik;direction:ltr;color:var(--r)}
.C .pr .eye .v{font:700 44px/1.1 Rubik;direction:ltr;text-align:start}
.C .pr .eye small{font:500 13px "IBM Plex Mono";color:var(--m);display:block;direction:ltr;text-align:start}
.C .pr .sc{display:flex;flex-wrap:wrap}.C .pr .sc span{padding:16px 22px;border-inline-end:1.5px solid var(--k);border-bottom:1.5px solid var(--k);font-weight:600;font-size:14px}.C .pr .sc span.on{background:var(--k);color:var(--w)}
</style>
</head>
<body>
<div class="top">
  <h1>SELRS — اتجاهات جديدة بالكامل (الجولة ٣)</h1>
  <div class="seg" id="dirs"></div>
  <div class="seg" id="scrs"></div>
</div>
<p class="note" id="note"></p>
<div class="stage"><div class="frame" id="frame"></div></div>

<script>
const L=t=>`<span class="ltr">${t}</span>`;
const P=[
 {n:'أحمد محمود السيد',svc:'كشف',doc:'د.الصواف',cl:'عيادة 1',t:'09:30',st:'مؤكد',tag:'جديد'},
 {n:'سارة علي حسن',svc:'إستشاري',doc:'د.الصواف',cl:'عيادة 1',t:'09:45',st:'مؤكد',tag:''},
 {n:'محمد حسن عبده',svc:'بنتاكام',doc:'الأشعة - بنتاكام',cl:'',t:'10:00',st:'مؤكد',tag:''},
 {n:'منى إبراهيم',svc:'أخصائي',doc:'د. السعدني',cl:'عيادة 2',t:'10:15',st:'قيد المراجعة',tag:'زائر'},
 {n:'خالد عمر فتحي',svc:'متابعة',doc:'د.الصواف',cl:'عيادة 1',t:'10:30',st:'مؤكد',tag:''},
 {n:'نورا عبد الله',svc:'كشف',doc:'د. السعدني',cl:'عيادة 2',t:'08:45',st:'معالج',tag:''},
 {n:'عمرو يوسف',svc:'أشعة',doc:'الأشعة - بنتاكام',cl:'',t:'08:30',st:'معالج',tag:''},
 {n:'هدى مصطفى',svc:'عملية',doc:'د.الصواف',cl:'',t:'11:00',st:'مؤكد',tag:''}
];
const byTime=[...P].sort((a,b)=>a.t.localeCompare(b.t));
const HOME=[['الاستقبال','الحجوزات والمرضى'],['مسار اليوم','خطوات الحالات خلال اليوم'],['مركز المريض','الملفات والزيارات'],['الحسابات','الإيرادات والتحصيل'],['الموظفين','الحضور والمرتبات'],['القرار الإكلينيكي','RSB وPTA وعمق الاستئصال'],['القيم الطبيعية للفحوصات','المدى الطبيعي ووحدات القياس'],['كفرالشيخ','وحدة الفرع'],['المخزن','المستلزمات والمخزون'],['الأرشيف','سجلات المرضى والعمليات'],['رسائل واتساب','صندوق الوارد'],['مركز الإدارة','الإعدادات والصلاحيات']];
const QA=['تسجيل مريض','تحديد موعد / كشف','حجز العمليات','متابعة','القياسات و الفحص','مقاس النظارة','بنتاكام','الروشتات','تحاليل و اشعه','تشخيص / تقرير','الملف الطبي'];
const SECTIONS=['التاريخ المرضي','القياسات والانكسار','Pentacam والتصوير','الخطة العلاجية','الفحوصات المطلوبة'];
const EYE=[['العين اليمنى','OD',['-3.25','-0.75','170','6/6','16']],['العين اليسرى','OS',['-2.75','-0.50','10','6/9','15']]];
const HEAD=['SPH','CYL','AX','VA','IOP'];

/* ---------- A · ضوء ---------- */
const svcK={كشف:'#22d3ee','إستشاري':'#7c5cff',أخصائي:'#a78bfa',بنتاكام:'#ff5cb8',أشعة:'#ff5cb8',متابعة:'#34d399',عملية:'#fbbf24'};
const Ash=(on,b)=>`<div class="A app"><div class="dock"><b>SELRS</b>${['الرئيسية','الاستقبال','مسار اليوم','المرضى','الحسابات'].map((t,i)=>`<a class="${i==on?'on':''}">${t}</a>`).join('')}</div>${b}</div>`;
const ring=()=>{const r=158,c=2*Math.PI*r;return `<svg width="340" height="340" viewBox="0 0 340 340"><defs><linearGradient id="gg" x1="0" x2="1"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#7c5cff"/></linearGradient></defs><circle cx="170" cy="170" r="${r}" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="2"/><circle cx="170" cy="170" r="${r}" fill="none" stroke="url(#gg)" stroke-width="6" stroke-linecap="round" stroke-dasharray="${c*.25} ${c}" transform="rotate(-90 170 170)"/><circle cx="170" cy="170" r="128" fill="none" stroke="rgba(255,255,255,.12)" stroke-dasharray="1 8" stroke-width="2"/></svg>`};
const A={
home:()=>Ash(0,`<div class="orb"><div class="side"><h1 style="font-size:40px">صباح <b>الخير</b><br>يا دكتور</h1><p class="mut">الخميس ٩ أكتوبر · طنطا</p></div>
 <div class="iris">${ring()}<div class="core"><div><b>8</b><br><span>مريض اليوم</span></div></div></div>
 <div class="side">${[['تم معالجتهم',2,'#34d399'],['في الانتظار',6,'#fbbf24'],['العمليات',1,'#ff5cb8']].map(([a,b,k])=>`<div class="gl stat" style="--k:${k}"><span><i></i>${a}</span><b>${b}</b></div>`).join('')}</div></div>
 <div class="mods">${HOME.map(([a,b])=>`<div class="gl m"><div class="dot"></div><div><b>${a}</b><br><span>${b}</span></div></div>`).join('')}</div>`),
today:()=>Ash(1,`<h1 style="font-size:38px;margin-bottom:6px">مرضى <b>اليوم</b></h1><p class="mut" style="margin-bottom:22px">الخميس ٩ أكتوبر · طنطا · 8 مرضى</p>
 <div class="acts">${QA.map((q,i)=>`<span class="${i==0?'p':''}">${i==0?'+ ':''}${q}</span>`).join('')}</div>
 <div class="tl">${byTime.map(p=>`<div class="h">${p.t}</div><div class="sl" style="--k:${svcK[p.svc]}"><div class="gl ev" style="opacity:${p.st=='معالج'?.5:1}"><div><b>${p.n} ${p.tag?`<span class="tg" style="--k:#fbbf24">${p.tag}</span>`:''}</b><small>${p.doc}${p.cl?' · '+p.cl:''}</small></div><div class="sp"><span class="tg" style="--k:${svcK[p.svc]}">${p.svc}</span><span class="mut">${p.st}</span></div></div></div>`).join('')}</div>`),
patient:()=>Ash(3,`<p class="mut">ملف المريض · ${L('P-20418')}</p><h1 style="font-size:60px">أحمد <b>محمود السيد</b></h1><p class="mut" style="margin-top:6px">٣٤ سنة · ${L('0100 123 4567')} · جديد · د.الصواف · عيادة 1</p>
 <div class="eyes">${EYE.map(([n,c,v],i)=>`<div class="gl eye" style="--k:${i?'#7c5cff':'#22d3ee'}"><div class="lens"><b>${v[0]}</b></div><h3>${n} · ${L(c)}</h3><table><tr>${HEAD.map(h=>`<th>${h}</th>`).join('')}</tr><tr>${v.map(x=>`<td>${x}</td>`).join('')}</tr></table></div>`).join('')}</div>
 <div class="sec">${SECTIONS.map((s,i)=>`<span class="${i==1?'on':''}">${s}</span>`).join('')}</div>`)
};

/* ---------- B · دفء ---------- */
const Bsh=(on,hello,b)=>`<div class="B app"><div class="hi"><div class="av">ص</div><div><h1>${hello[0]}</h1><p>${hello[1]}</p></div><div class="sp">طنطا ▾</div></div>${b}<div class="dock">${['الرئيسية','الاستقبال','المسار','المرضى','الحسابات'].map((t,i)=>`<a class="${i==on?'on':''}">${t}</a>`).join('')}</div></div>`;
const colK=['#c9623a','#5f7f6b','#b08a4a','#8a6f9e','#4f7f93','#c9623a','#5f7f6b','#b08a4a'];
const B={
home:()=>Bsh(0,['أهلاً د. الصواف','عندك ٦ مرضى في الانتظار ومريضة عمليات الساعة ١١'],`<div class="bento">
 <div class="t c w2 h2"><div><span>مرضى اليوم</span></div><div><div class="n">8</div><span>تم معالجة ٢ منهم</span></div></div>
 <div class="t s w2 h2"><div><b>الاستقبال</b><span>الحجوزات والمرضى</span></div><div class="n" style="font-size:28px">+ تسجيل مريض</div></div>
 <div class="t d w2"><div><b>مسار اليوم</b><span>خطوات الحالات خلال اليوم</span></div></div>
 <div class="t g w2"><div><b>مركز المريض</b><span>الملفات والزيارات</span></div></div>
 ${HOME.slice(3).map(([a,b],i)=>`<div class="t ${['p','','g','d','','p','','g','d'][i]}"><div><b style="font-size:15px">${a}</b><span>${b}</span></div></div>`).join('')}</div>`),
today:()=>Bsh(1,['مرضى اليوم','الخميس ٩ أكتوبر · طنطا'],`<div class="days">${[['س','٤'],['ح','٥'],['ن','٦'],['ث','٧'],['ر','٨'],['خ','٩'],['ج','١٠']].map(([a,b],i)=>`<div class="${i==5?'on':''}"><small>${a}</small><b>${b}</b></div>`).join('')}</div>
 <div class="chips">${QA.slice(0,8).map((q,i)=>`<span class="${i==0?'p':''}">${i==0?'+ ':''}${q}</span>`).join('')}</div>
 <div class="lst">${byTime.map((p,i)=>`<div class="pc"><div class="a" style="--k:${colK[i]}">${p.n[0]}</div><div><b>${p.n}${p.tag?` · <small>${p.tag}</small>`:''}</b><small>${p.svc} · ${p.doc}${p.cl?' · '+p.cl:''}</small></div><span class="tm">${p.t}</span><span class="st ${p.st=='قيد المراجعة'?'o':p.st=='معالج'?'d':''}">${p.st}</span></div>`).join('')}</div>`),
patient:()=>Bsh(3,['ملف المريض','آخر تحديث اليوم ٠٩:٤٠'],`<div class="pg"><div class="prof"><div class="bl">أ</div><h2>أحمد محمود السيد</h2><p>٣٤ سنة<br>${L('0100 123 4567')}<br>ملف ${L('P-20418')}</p><p>كشف · د.الصواف · عيادة 1</p><button class="btn">بدء الفحص</button></div>
 <div class="col"><div class="secs">${SECTIONS.map((s,i)=>`<span class="${i==1?'on':''}">${s}</span>`).join('')}</div>
 <div class="ey">${EYE.map(([n,c,v],i)=>`<div class="eyb t ${i?'p':'g'}" style="border-radius:40px"><h4>${n} · ${L(c)}</h4><b>${v[0]} / ${v[1]} × ${v[2]}</b><span style="font-size:13px;color:#6a6358">حدة ${v[3]} · ضغط ${v[4]}</span></div>`).join('')}</div>
 <div class="t" style="border-radius:40px;padding:24px 28px"><b style="font-size:16px">التاريخ المرضي</b><span style="line-height:1.9;margin-top:8px;display:block">يستعمل نظارة منذ ٢٠١٢، لا أمراض مزمنة، لا حساسية دوائية معروفة.</span></div>
 <div class="t d" style="border-radius:40px;padding:24px 28px"><b style="font-size:16px">الفحوصات المطلوبة</b><span style="margin-top:8px;display:block">بنتاكام · سمك القرنية</span></div></div></div>`)
};

/* ---------- C · صارم ---------- */
const Csh=(on,b)=>`<div class="C app"><div class="bar"><div class="l">SELRS</div><nav>${['الرئيسية','الاستقبال','المسار','المرضى','الحسابات'].map((t,i)=>`<a class="${i==on?'on':''}">${t}</a>`).join('')}</nav><div class="u">د.الصواف · طنطا</div></div>${b}</div>`;
const C={
home:()=>Csh(0,`<div class="hero"><div class="big"><small>الخميس 2026.10.09</small><div class="num">08<span>.</span></div><h1>مريض اليوم</h1></div>
 <div class="kv"><div><b>02</b><span>تم معالجتهم</span></div><div class="r"><b>06</b><span>في الانتظار</span></div><div><b>01</b><span>العمليات</span></div><div><b>22<small style="font-size:24px">د</small></b><span>أقدم انتظار</span></div></div></div>
 <div class="idx">${HOME.map(([a,b],i)=>`<div class="ix"><i>${String(i+1).padStart(2,'0')}</i><div><b>${a}</b><br><span>${b}</span></div><em>←</em></div>`).join('')}</div>`),
today:()=>Csh(1,`<div class="tools">${QA.map((q,i)=>`<span class="${i==0?'p':''}">${i==0?'+ ':''}${q}</span>`).join('')}</div>
 <table><tr><th>الوقت</th><th>المريض</th><th>الخدمة</th><th>الطبيب</th><th>العيادة</th><th>الحالة</th></tr>
 ${byTime.map(p=>`<tr class="${p.st=='معالج'?'done':''}"><td><span class="t">${p.t}</span></td><td class="n">${p.n} ${p.tag?`<span class="sb">${p.tag}</span>`:''}</td><td>${p.svc}</td><td>${p.doc}</td><td>${p.cl||'—'}</td><td><span class="sb ${p.st=='قيد المراجعة'?'r':p.st=='معالج'?'k':''}">${p.st}</span></td></tr>`).join('')}</table>`),
patient:()=>Csh(3,`<div class="pg"><div class="pl"><small>ملف المريض / P-20418</small><h1>أحمد محمود السيد</h1><div class="m"><div><span>السن</span><b>34</b></div><div><span>الهاتف</span><b>0100 123 4567</b></div><div><span>آخر زيارة</span><b>2026-09-02</b></div><div><span>الخدمة</span><b style="font-family:inherit">كشف</b></div></div><button class="btn">بدء الفحص ←</button></div>
 <div class="pr">${EYE.map(([n,c,v])=>`<div class="eye"><h4>${c}</h4><div><div class="v">${v[0]} ${v[1]} × ${v[2]}</div><small>VA ${v[3]} · IOP ${v[4]} · ${n}</small></div></div>`).join('')}
 <div class="sc">${SECTIONS.map((s,i)=>`<span class="${i==1?'on':''}">${s}</span>`).join('')}</div></div></div>`)
};

const DIRS={A:['أ · ضوء','داكن ومضيء: قزحية مضيئة في مركز الرئيسية، لوح زجاجي، قائمة عائمة، خط زمني للمرضى، وعينان كدائرتين مضيئتين. إحساس أداة تشخيص عصرية بدل لوحة إدارة.',A],
 B:['ب · دفء','رمل وطين وأخضر مريمية، أشكال مستديرة جداً، بنتو غير متساوٍ، شريط تنقل سفلي عائم. حاسّ بالراحة والود، أقرب لتطبيق صحة منه لنظام إداري.',B],
 C:['ج · صارم','أبيض وأسود مع أحمر إشارة واحد، أرقام ضخمة، شبكة خطوط ظاهرة، بدون زوايا مستديرة. سريع القراءة ولا يشبه أي شيء في النظام الحالي.',C]};
const SCR={home:'الرئيسية',today:'مرضى اليوم',patient:'ملف المريض'};
let d='A',s='home';
const mk=(el,obj,cur,set)=>{el.innerHTML=Object.entries(obj).map(([k,v])=>`<button class="${k==cur?'on':''}" data-k="${k}">${Array.isArray(v)?v[0]:v}</button>`).join('');el.onclick=e=>{const k=e.target.dataset.k;if(k){set(k);draw()}}};
function draw(){
 mk(document.getElementById('dirs'),DIRS,d,k=>d=k);
 mk(document.getElementById('scrs'),SCR,s,k=>s=k);
 document.getElementById('note').textContent=DIRS[d][1];
 document.getElementById('frame').innerHTML=DIRS[d][2][s]();
}
draw();
</script>
</body>
</html>
