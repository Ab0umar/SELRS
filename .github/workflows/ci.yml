name: SRV100_Acc CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: mysql://root:root@127.0.0.1:3306/selrs_test
      DATABASE_TEST_URL: mysql://root:root@127.0.0.1:3306/selrs_test

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: selrs_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: pnpm

      - name: Verify tools
        run: |
          node -v
          pnpm -v

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Initialize disposable test database
        run: pnpm db:push

      - name: Run TypeScript Check
        run: pnpm check

      - name: Prevent tracked signing keys and private keys
        run: pnpm security:files

      - name: Check for raw Tailwind palette tokens
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
          else
            BASE_SHA="${{ github.event.before }}"
          fi
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            BASE_SHA="$(git rev-list --max-parents=0 HEAD)"
          fi
          if git diff --unified=0 "$BASE_SHA" "$GITHUB_SHA" -- client/src \
            | grep '^+' \
            | grep -v '^+++' \
            | grep -E "(sky|cyan|pink|indigo|teal|emerald|rose|violet|fuchsia|amber|orange|yellow|lime|green|blue|red|purple)-[0-9]+"; then
            echo "❌ New raw Tailwind palette tokens found. Use semantic tokens instead (primary, secondary, success, warning, destructive, muted)."
            exit 1
          else
            echo "✅ No new raw Tailwind palette tokens detected."
          fi

      - name: Run Tests
        run: pnpm test

      - name: Verify webhook and queue behavior
        run: pnpm exec vitest run --config vitest.backend.config.ts server/tests/whatsappWebhook.test.ts server/tests/queueSnapshot.test.ts

      - name: Run Build
        run: pnpm build

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Seed E2E admin user
        env:
          E2E_USER: ${{ secrets.E2E_USER }}
          E2E_PASS: ${{ secrets.E2E_PASS }}
        run: pnpm e2e:seed

      - name: Run Playwright tests
        env:
          BASE_URL: ${{ secrets.E2E_BASE_URL }}
          E2E_USER: ${{ secrets.E2E_USER }}
          E2E_PASS: ${{ secrets.E2E_PASS }}
        run: pnpm test:ui
