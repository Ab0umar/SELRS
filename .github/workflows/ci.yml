name: Selrs.cc CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: mysql://root:root@127.0.0.1:3306/selrs_test
      DATABASE_TEST_URL: mysql://root:root@127.0.0.1:3306/selrs_test
      # Throwaway signing key for the CI-only server; never used outside this job.
      JWT_SECRET: ci-only-jwt-secret-for-disposable-test-runs-0001

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: selrs_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: pnpm

      - name: Verify tools
        run: |
          node -v
          pnpm -v

      # msnodesqlv8 is the Windows-auth MSSQL driver, loaded only on the clinic's
      # Windows server; compiling it here needs Microsoft's ODBC driver headers.
      - name: Skip building the Windows-only MSSQL driver
        run: |
          sed -i 's/^  msnodesqlv8: true/  msnodesqlv8: false/' pnpm-workspace.yaml
          grep -q "^  msnodesqlv8: false" pnpm-workspace.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Built straight from drizzle/schema.ts. The migration snapshots stop at
      # 0040, so generate-and-migrate re-creates tables that 0041+ already made.
      - name: Initialize disposable test database
        run: pnpm exec drizzle-kit push --force

      - name: Run TypeScript Check
        run: pnpm check

      - name: Prevent tracked signing keys and private keys
        run: pnpm security:files

      - name: Check for raw Tailwind palette tokens
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
          else
            BASE_SHA="${{ github.event.before }}"
          fi
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            BASE_SHA="$(git rev-list --max-parents=0 HEAD)"
          fi
          if git diff --unified=0 "$BASE_SHA" "$GITHUB_SHA" -- client/src \
            | grep '^+' \
            | grep -v '^+++' \
            | grep -E "(sky|cyan|pink|indigo|teal|emerald|rose|violet|fuchsia|amber|orange|yellow|lime|green|blue|red|purple)-[0-9]+"; then
            echo "❌ New raw Tailwind palette tokens found. Use semantic tokens instead (primary, secondary, success, warning, destructive, muted)."
            exit 1
          else
            echo "✅ No new raw Tailwind palette tokens detected."
          fi

      - name: Run Tests
        run: pnpm test

      - name: Verify webhook and queue behavior
        run: pnpm exec vitest run --config vitest.backend.config.ts server/tests/whatsappWebhook.test.ts server/tests/queueSnapshot.test.ts

      - name: Run Build
        run: pnpm build

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      # Fixed credentials: CI seeds them into the disposable test database above.
      - name: Seed E2E admin user
        env:
          E2E_USER: e2e-ci-admin
          E2E_PASS: "E2e-Ci-Disposable-2026!"
        run: pnpm e2e:seed

      - name: Run Playwright tests
        env:
          E2E_USER: e2e-ci-admin
          E2E_PASS: "E2e-Ci-Disposable-2026!"
        run: pnpm test:ui
