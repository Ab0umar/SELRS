<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#003d82" />
    <title>معاينة لودر عيون الشروق</title>
    <style>
      :root { color: #17355f; background: #f8fafc; font-family: Cairo, Tahoma, Arial, sans-serif; }
      * { box-sizing: border-box; }
      body { min-height: 100svh; margin: 0; display: grid; place-items: center; background: radial-gradient(circle at 50% 18%, #eaf3ff 0%, #f8fafc 46%, #edf3fa 100%); }
      main { display: grid; place-items: center; gap: 28px; padding: 32px 24px; text-align: center; }
      .mark { position: relative; width: min(78vw, 360px); aspect-ratio: 1; overflow: hidden; border-radius: 50%; background: #fff; filter: drop-shadow(0 18px 24px rgb(0 61 130 / 18%)); }
      .mark > img { display: block; width: 100%; height: 100%; object-fit: cover; }
      .eye-motion { position: absolute; top: 36%; left: 23%; width: 54%; aspect-ratio: 312 / 110; overflow: hidden; }
      .eye-motion img { display: block; width: 100%; height: 100%; }
      .copy { display: grid; gap: 8px; }
      h1 { margin: 0; color: #003d82; font-size: 22px; font-weight: 800; }
      p { margin: 0; color: #5b6b80; font-size: 14px; }
      .dots { display: flex; gap: 8px; direction: ltr; }
      .dots i { width: 7px; height: 7px; border-radius: 50%; background: #c9d7ea; animation: dot 1.2s ease-in-out infinite; }
      .dots i:nth-child(2) { animation-delay: .16s; } .dots i:nth-child(3) { animation-delay: .32s; }
      @keyframes dot { 50% { background: #ff8a0a; transform: translateY(-4px); } }
      @media (prefers-reduced-motion: reduce) { .lid, .dots i { animation: none; } }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" role="img" aria-label="شعار عيون الشروق بعين متحركة">
        <img src="/shorouk-eyes-logo.jpg" alt="" />
        <span class="eye-motion" aria-hidden="true"><img src="/eye-motion.gif" alt="" /></span>
      </div>
      <div class="copy"><h1>عيون الشروق</h1><p>جاري تجهيز النظام</p></div>
      <div class="dots" aria-hidden="true"><i></i><i></i><i></i></div>
    </main>
  </body>
</html>
