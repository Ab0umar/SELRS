function subnav(){const group=modules.find(m=>m[0]===page)[2];return `<nav class="subnav" aria-label="Related workspaces">${modules.filter(m=>m[2]===group).map(([id,label])=>`<button data-page="${id}" ${id===page?'aria-current="page"':''}>${label}</button>`).join('')}</nav>`;}
function home(){return `<div class="home-layout"><section><p class="home-intro">Patient care first.<br>Everything else within reach.</p>${[['dashboard','01','The patient flow','See who is waiting, in examination, or ready for review.'],['bookings','02','The appointment book','Plan the day and review incoming requests.'],['patients','03','The patient record','Find the right person and continue their care.'],['attendance','04','The people behind the day','Review shift exceptions and attendance.'],['accounting','05','The center’s accounts','Receipts, expenses, and daily reconciliation.'],['stockroom','06','The resources you need','Stock levels, replenishment, and reports.']].map(([id,n,title,caption])=>`<button class="destination" data-page="${id}"><span class="index">${n}</span><span><strong>${title}</strong><small>${caption}</small></span><span class="verb">Open workspace</span></button>`).join('')}</section><aside class="home-secondary"><section class="next-patient"><div class="label">Next demo appointment / Friday, 9 October</div><div class="large-time num">09:15</div><h2>Demo patient 014</h2><p>Consultant review<br>Room 02 / Confirmed</p><button class="primary" data-page="bookings">Open appointment book</button></section><section class="notes-list"><h3>Before the day closes</h3><div class="review-line"><div><strong>Review booking requests</strong><small>Two demo requests need a room assignment.</small></div><button class="link-button" data-page="bookings">Review</button></div><div class="review-line"><div><strong>Check shift exceptions</strong><small>A late arrival and a missing punch.</small></div><button class="link-button" data-page="attendance">Review</button></div><div class="review-line"><div><strong>Reconcile the register</strong><small>Review the supporting documents.</small></div><button class="link-button" data-page="accounting">Review</button></div></section></aside></div>`;}
function toolbar(){return `<div class="toolbar"><div class="search-wrap"><input id="search" type="search" aria-label="Search workspace records" placeholder="Find a patient, employee, entry, or item" value="${e(query)}"></div><select id="state" aria-label="Preview data state">${[['ready','Demo: populated'],['empty','Demo: empty'],['loading','Demo: loading'],['error','Demo: error']].map(([value,label])=>`<option value="${value}" ${state===value?'selected':''}>${label}</option>`).join('')}</select></div>`;}
function message(){const copy={empty:['Nothing to review here.','This is the empty-state preview. Restore the synthetic records to continue.','Restore demo records'],loading:['Loading the workspace.','This is a loading preview, not a live request. Your page context stays visible.','Finish loading preview'],error:['The records did not load.','This simulated connection error preserves your workspace. Retry to restore demo records.','Retry']}[state];return `<section class="message ${state==='loading'?'loading':''}" role="${state==='error'?'alert':'status'}"><h2>${copy[0]}</h2><p>${copy[1]}</p><button data-restore class="primary">${copy[2]}</button></section>`;}
function noMatches(){return '<section class="message"><h2>No matching records.</h2><p>Try another label or clear the search to return to the full register.</p><button data-clear>Clear search</button></section>';}
function detail(row,headers){return `<section class="inline-detail"><div><h3>${e(row[0])}</h3><p>This is a synthetic demo record. Details expand inside the register so the working list stays in context.</p><p>Review the identity and relevant source fields before taking the next step.</p></div><dl>${row.slice(1).map((value,i)=>`<div><dt>${headers[i+1]}</dt><dd>${e(value)}</dd></div>`).join('')}</dl><div class="inline-actions"><button data-feedback>Preview review feedback</button><button data-record="">Close details</button></div></section>`;}
function register(){const data=records[page];const rows=data.rows.filter(r=>r.join(' ').toLowerCase().includes(query.toLowerCase()));if(!rows.length)return noMatches();return `<section class="register"><div class="register-head">${data.head.slice(0,4).map(h=>`<span>${h}</span>`).join('')}<span>Details</span></div>${rows.map(row=>`<article><div class="register-line">${row.slice(0,4).map((value,i)=>`<div class="cell"><span class="cell-label">${data.head[i]}</span>${i===0?`<strong>${e(value)}</strong><small>${e(row[4])}</small>`:`<span class="${i===3?'status '+(isReview(row)?'review':''):'num'}">${e(value)}</span>`}</div>`).join('')}<div class="cell"><button class="link-button" data-record="${e(row[4])}" aria-expanded="${openRecord===row[4]}">${openRecord===row[4]?'Close':'Inspect'}</button></div></div>${openRecord===row[4]?detail(row,data.head):''}</article>`).join('')}</section>`;}
function queue(){const rows=records.patients.rows.filter(r=>r.join(' ').toLowerCase().includes(query.toLowerCase()));if(!rows.length)return noMatches();return `<div class="summary-text"><span><strong>${rows.filter(r=>r[3]==='Waiting').length}</strong> waiting</span><span><strong>${rows.filter(r=>r[3]==='In examination').length}</strong> in examination</span><span><strong>${rows.filter(r=>r[3]==='Ready for review').length}</strong> ready for review</span><span class="muted">Counts reflect synthetic records below.</span></div><div class="queue-board">${['Waiting','In examination','Ready for review'].map(stage=>`<section class="queue-lane"><div class="lane-head"><h2>${stage}</h2><span>${rows.filter(r=>r[3]===stage).length} demo records</span></div>${rows.filter(r=>r[3]===stage).map(row=>`<article class="queue-record"><div class="record-code">${row[4]} / Arrival ${row[2]}</div><h3>${row[0]}</h3><p>${row[1]}</p><button data-patient="${row[4]}">Open record</button></article>`).join('')||'<p class="muted" style="margin-top:20px">No demo patients at this stage.</p>'}</section>`).join('')}</div><section class="review-footer"><div><h3>Reception and care share the same queue.</h3><p>Patient identity stays visible before every handoff.</p></div><button data-page="bookings">Review the appointment book</button></section>`;}
function agenda(){const rows=bookings.filter(r=>r.join(' ').toLowerCase().includes(query.toLowerCase()));if(!rows.length)return noMatches();return `<div class="work-heading"><div><h2>Friday, 9 October</h2><p>${rows.length} synthetic appointments / ${rows.filter(r=>r[3]==='Pending review').length} pending review</p></div><span class="flow-label">Time first. Room next. Patient always visible.</span></div><div class="agenda-header"><span>Time</span><span>Room 01<small>Follow-up</small></span><span>Room 02<small>Consultant</small></span><span>Review / imaging<small>Unassigned or imaging</small></span></div>${['09','10','11','12','13','14','15'].map(hour=>{const current=rows.filter(r=>r[0].startsWith(hour));return `<div class="agenda-row"><div class="hour num">${hour}:00</div>${['Room 01','Room 02','other'].map(room=>`<div>${current.filter(r=>room==='other'?!['Room 01','Room 02'].includes(r[4]):r[4]===room).map(r=>`<button class="agenda-entry ${r[3]==='Pending review'?'pending':''}" data-booking="${e(r[1])}"><strong>${r[0]} / ${e(r[1])}</strong><small>${r[2]}<br>${r[3]}</small></button>`).join('')||'<span class="open-slot">No demo appointment</span>'}</div>`).join('')}</div>${current.map(r=>`<button class="agenda-entry-mobile ${r[3]==='Pending review'?'pending':''}" data-booking="${e(r[1])}"><strong>${r[0]} / ${e(r[1])}</strong><small>${r[2]} / ${r[4]}<br>${r[3]}</small></button>`).join('')}`;}).join('')}`;}
function reports(){const rows=[['Patient flow','Review arrivals, examination stages, and consultant reviews.'],['Attendance exceptions','Review missing punches and shift exceptions for the period.'],['Receipt register','Review receipt entries and supporting account classifications.'],['Payroll summary','Review draft employee totals before closing the period.']].filter(row=>row.join(' ').toLowerCase().includes(query.toLowerCase()));if(!rows.length)return noMatches();return `<div class="report-list">${rows.map(([title,caption],i)=>`<article class="report-option"><span class="report-number">0${i+1}</span><div><h3>${title}</h3><p>${caption}</p><button class="link-button" data-report="${title}">Preview demo report</button></div></article>`).join('')}</div>`;}
function settings(){return `<form class="settings" id="preferences"><section class="settings-section"><h2>Where you work</h2><label class="field">Default branch<select name="branch"><option ${branch==='Tanta center'?'selected':''}>Tanta center</option><option ${branch==='Kafr El Sheikh center'?'selected':''}>Kafr El Sheikh center</option></select><small>Updates the branch label in this preview only.</small></label></section><section class="settings-section"><h2>Your feedback</h2><label class="field">Notes on this direction<textarea name="notes" placeholder="What would you keep or change?"></textarea><small>Notes are not persisted or sent anywhere.</small></label></section><button class="primary">Apply preview branch</button></form>`;}
function content(){if(page==='home')return home();if(page==='settings')return settings();if(state!=='ready')return message();if(page==='dashboard')return queue();if(page==='bookings')return agenda();if(page==='reports')return reports();return register();}
function render(){header();const [title,caption]=titles[page];const heading={operations:'Scheduled procedures',attendance:'Today’s punch register',salary:'October 2026 / Draft period',accounting:'October 2026 / Entry register',stockroom:'Available stock',patients:'Patient identity register'}[page];document.querySelector('#workspace').innerHTML=`<div class="context"><span><strong>${e(branch)}</strong> / ${modules.find(m=>m[0]===page)[1]}</span><span class="date">Friday, 9 October 2026 / Demo day</span></div><section class="heading"><div><h1>${title}</h1><p>${caption}</p></div><div class="actions"><button id="design-notes">About this direction</button><button class="primary" data-action>${page==='bookings'||page==='home'||page==='dashboard'?'New demo booking':page==='patients'?'Preview registration':page==='salary'?'Review period':page==='attendance'?'Review exceptions':page==='accounting'?'Preview entry':page==='stockroom'?'Request supplies':page==='reports'?'Report scope':page==='settings'?'Preview booking':'Review preparation'}</button></div></section>${subnav()}${['home','settings'].includes(page)?'':toolbar()}${heading?`<div class="work-heading"><div><h2>${heading}</h2><p>Selected branch / Synthetic sample records</p></div><button data-refresh>Reset demo view</button></div>`:''}<div id="content">${content()}</div><footer class="proposal-footer"><span>Direction 04 / Paper & signal<br>English concept preview. No changes to the live SELRS app.</span><a href="full-app-directions.html">Compare with directions 01–03</a></footer>`;try{const url=new URL(location.href);url.searchParams.set('page',page);history.replaceState(null,'',url);}catch{}}
function update(){document.querySelector('#content').innerHTML=content();}
function dialog(title,body){const target=document.querySelector('#dialog');target.innerHTML=`<div class="dialog-heading"><h2 id="dialog-title">${e(title)}</h2><button data-close>Close</button></div><div class="dialog-body">${body}</div>`;target.showModal();}
function bookingForm(){dialog('A new demo appointment','<p>Test the layout with a synthetic appointment. It stays in memory and resets on reload.</p><form id="booking-form"><label class="field">Demo patient label<input name="patient" required placeholder="Demo patient label"></label><label class="field">Service<select name="service"><option>Consultant review</option><option>Follow-up</option><option>Refraction</option><option>Imaging</option></select></label><label class="field">Time<input name="time" type="time" min="09:00" max="15:59" required></label><label class="field">Room<select name="room"><option>Unassigned</option><option>Room 01</option><option>Room 02</option><option>Imaging room</option></select></label><div class="dialog-actions"><button type="button" data-close>Cancel</button><button class="primary">Add demo booking</button></div></form>');}
document.addEventListener('click',event=>{const b=event.target.closest('button');if(!b)return;if(b.dataset.page){go(b.dataset.page);return;}if(b.id==='theme'){document.body.classList.toggle('dark');b.textContent=document.body.classList.contains('dark')?'Light view':'Dark view';return;}if(b.hasAttribute('data-record')){openRecord=openRecord===b.dataset.record?'':b.dataset.record;update();return;}if(b.dataset.patient){go('patients');openRecord=b.dataset.patient;update();return;}if(b.dataset.booking){const row=bookings.find(r=>r[1]===b.dataset.booking);dialog('Demo appointment',`<p>${e(row[1])} / Synthetic record</p><dl class="design-dl">${['Time','Patient','Service','Review','Room'].map((h,i)=>`<dt>${h}</dt><dd>${e(row[i])}</dd>`).join('')}</dl><div class="dialog-actions" style="margin-top:24px"><button data-close>Return to schedule</button></div>`);return;}if(b.hasAttribute('data-close')){document.querySelector('#dialog').close();return;}if(b.hasAttribute('data-feedback')){notify('Review feedback previewed. No live record was changed.');return;}if(b.hasAttribute('data-restore')||b.hasAttribute('data-refresh')){state='ready';query='';render();notify('Synthetic records restored.');return;}if(b.hasAttribute('data-clear')){query='';render();return;}if(b.id==='design-notes'){dialog('Paper & signal / Direction 04','<p>Reading this as a task-first medical-center workspace with bold, open typography. ENERGY 2 / RHYTHM 2 / MOTION 1.</p><dl class="design-dl"><dt>Structure</dt><dd>Working areas organize care, people, money, and resources. There is no permanent sidebar or card-grid homepage.</dd><dt>Typography</dt><dd>Large system-sans headings identify the task; ordinary body type and tabular figures keep records readable.</dd><dt>Color</dt><dd>White paper and ink support long sessions. Burnt orange identifies the primary action and pending review, with text labels for state.</dd><dt>Records</dt><dd>Details expand inside registers so the surrounding list remains visible. Patient flow uses stages; bookings use time and rooms.</dd><dt>Spacing</dt><dd>Open rules separate tasks. Smaller gaps join identity and source fields. Mobile records reflow into labelled lines.</dd><dt>Motion</dt><dd>Only hover and pressed feedback. No decorative animation, illustrations, chart filler, or shadows on work areas.</dd><dt>Depth</dt><dd>The module popover has a shadow only to distinguish an overlapping navigation layer.</dd></dl>');return;}if(b.dataset.report){dialog(b.dataset.report,'<p>Synthetic report preview / '+e(branch)+' / October 2026</p><dl class="design-dl"><dt>Scope</dt><dd>Selected demo branch</dd><dt>Period</dt><dd>October 2026</dd><dt>Source</dt><dd>Local sample data only</dd><dt>Purpose</dt><dd>Review the selected operational report before export or print in the real app.</dd></dl>');return;}if(b.hasAttribute('data-action')){if(['home','dashboard','bookings','settings'].includes(page))bookingForm();else if(page==='salary')dialog('Review the draft period','<p>This is a synthetic payroll preview, not a calculated or finalized payroll.</p><ol><li>Review shift exceptions.</li><li>Check adjustments and advances.</li><li>Verify employee totals.</li></ol><div class="dialog-actions"><button data-close>Return to period</button><button data-go-attendance class="primary">Review attendance</button></div>');else if(page==='attendance'){query='missing';document.querySelector('#search').value=query;update();notify('Showing missing-punch demo records.');}else if(page==='operations'){query='consent';document.querySelector('#search').value=query;update();}else if(page==='reports')dialog('Choose the demo scope','<form id="scope-form"><label class="field">Report period<select><option>October 2026</option><option>September 2026</option></select></label><label class="field">Branch<select><option>Tanta center</option><option>Kafr El Sheikh center</option></select></label><button class="primary">Preview scope</button></form>');else dialog(page==='patients'?'Preview patient registration':page==='accounting'?'Preview accounting entry':'Preview supply request','<p>Validate a local form without creating a patient, financial entry, or stock transaction.</p><form id="sample-form"><label class="field">'+(page==='patients'?'Demo patient label':page==='accounting'?'Entry description':'Demo item label')+'<input required placeholder="Synthetic example only"></label>'+(page==='patients'?'':`<label class="field">${page==='accounting'?'Amount / EGP':'Quantity'}<input type="number" min="0.01" step="0.01" required></label>`)+'<div class="dialog-actions"><button type="button" data-close>Cancel</button><button class="primary">Validate preview</button></div></form>');return;}if(b.hasAttribute('data-go-attendance')){document.querySelector('#dialog').close();go('attendance');}});
document.addEventListener('input',event=>{if(event.target.id==='search'){query=event.target.value;update();}});
document.addEventListener('change',event=>{if(event.target.id==='mobile-page')go(event.target.value);if(event.target.id==='branch'){branch=event.target.value;render();}if(event.target.id==='state'){state=event.target.value;update();}});
document.addEventListener('keydown',event=>{if(event.key==='Escape')document.querySelector('.menu').open=false;});
document.addEventListener('submit',event=>{event.preventDefault();if(event.target.id==='booking-form'){const data=new FormData(event.target);bookings.push([data.get('time'),data.get('patient').trim(),data.get('service'),'Pending review',data.get('room')]);bookings.sort((a,b)=>a[0].localeCompare(b[0]));document.querySelector('#dialog').close();go('bookings');notify('Added to this demo only. Reloading resets the appointment book.');}else if(event.target.id==='preferences'){branch=new FormData(event.target).get('branch');document.querySelector('#branch').value=branch;render();notify('Preview branch updated locally.');}else{document.querySelector('#dialog').close();notify('Preview validated. Nothing was saved or sent.');}});
render();
</script>
</body>
</html>
