<script>
const modules=[['home','Home','Your working day, organized by task.'],['dashboard','Dashboard','Patient flow and work requiring attention.'],['patients','Patients','Find a record and review the clinical history.'],['bookings','Bookings','Review requests and plan appointments.'],['operations','Operations','Prepare lists and track scheduled procedures.'],['attendance','Attendance','Review punches, shifts, and exceptions.'],['salary','Salary','Review payroll periods before finalization.'],['accounting','Accounting','Inspect entries, receipts, and expenses.'],['stockroom','Stockroom','Track quantities and replenishment.'],['reports','Reports','Review operational and financial summaries.'],['settings','Settings','Set workspace and display preferences.']];
const icons={home:'M3 10 12 3l9 7v11h-6v-7H9v7H3Z',dashboard:'M3 3h7v8H3Zm11 0h7v5h-7ZM3 15h7v6H3Zm11-3h7v9h-7Z',patients:'M16 21v-3a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v3M9 10a4 4 0 1 0 0-8 4 4 0 0 0 0 8M17 3a4 4 0 0 1 0 8m3 10v-3a4 4 0 0 0-3-4',bookings:'M4 5h16v16H4ZM4 10h16M8 2v6m8-6v6m-8 7h3m3 0h3',operations:'M3 12h5l3-8 3 16 3-8h4',attendance:'M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18m0 4v5l4 2',salary:'M3 5h18v14H3ZM7 9h1m8 6h1m-5-7a4 4 0 1 0 0 8 4 4 0 0 0 0-8',accounting:'M5 3h14v18l-3-2-4 2-4-2-3 2Zm3 5h8M8 12h8m-8 4h5',stockroom:'m3 7 9-4 9 4v11l-9 4-9-4Zm0 0 9 4 9-4m-9 4v11M7 5l9 4',reports:'M4 3v18h17M8 17v-5m5 5V8m5 9V4',settings:'M4 6h16M4 12h16M4 18h16M8 3v6m8 0v6m-6 0v6'};
const svg=id=>`<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true"><path d="${icons[id]||icons.patients}"/></svg>`;
const directions={a:{name:'Clinical workbench',description:'A persistent workbench for teams moving between patient records and operational registers.',dials:'ENERGY 1 / RHYTHM 1 / MOTION 1',color:'Ink blue anchors the clinical workspace; a single blue accent identifies the next action.',layout:'Persistent labelled navigation, a central working register, and a right-hand context panel minimize context switching.',type:'Segoe UI uses familiar system letterforms for long shifts and dense mixed data.',motif:'Framed registers with a consistent record inspector.',spacing:'24px separates tasks; tighter row spacing keeps related records together.'},b:{name:'Patient-first',description:'An open daybook with patient care at the center and support work in the margins.',dials:'ENERGY 2 / RHYTHM 2 / MOTION 1',color:'Warm paper and forest green create a less institutional clinical atmosphere without decorative color.',layout:'Top navigation gives the working day the full page; a left margin holds planning notes beside a patient-first daybook.',type:'Georgia titles echo a written daybook; system sans keeps fields and amounts easy to scan.',motif:'Editorial titles, open section rules, and appointment time markers.',spacing:'Generous patient rows slow the scan at record identity; financial registers remain compact.'},c:{name:'Operations console',description:'A compact exception-first console for reception, finance, and center operations.',dials:'ENERGY 1 / RHYTHM 2 / MOTION 1',color:'Slate structure with a petrol accent distinguishes current work without a multicolor dashboard.',layout:'A narrow labelled module rail saves horizontal space; exception strips precede compact registers and operational context.',type:'System sans and tabular figures favor scanning identifiers, times, and amounts.',motif:'Compact register headers and exception-first summaries.',spacing:'16px between working areas and compact rows put more actionable data in view.'}};
const params=new URLSearchParams(location.search);let direction=directions[params.get('variant')]?params.get('variant'):'a',page=modules.some(m=>m[0]===params.get('page'))?params.get('page'):'home',theme='light',branch='Tanta center',viewState='ready',query='',scope='all',toastTimer;
let bookings=[['09:15','Demo patient 014','Consultant review','Confirmed','Room 02'],['09:40','Demo patient 028','Refraction','Pending review','Unassigned'],['10:10','Demo patient 037','Follow-up','Confirmed','Room 01'],['10:30','Demo patient 051','Consultant review','Pending review','Unassigned'],['11:00','Demo patient 066','Imaging','Confirmed','Imaging room']];
const patientRows=[['Demo patient 014','P-0014','Consultant review','Waiting','09:15'],['Demo patient 028','P-0028','Refraction','In examination','09:40'],['Demo patient 037','P-0037','Follow-up','Ready for review','10:10'],['Demo patient 051','P-0051','Consultant review','Not arrived','10:30'],['Demo patient 066','P-0066','Imaging','Waiting','11:00']];
const tables={patients:{headers:['Patient','Record','Visit','Status','Arrival'],rows:patientRows},operations:{headers:['Procedure','Patient','Date / time','Preparation','Room'],rows:[['Cataract assessment','Demo patient 081','09 Oct / 12:00','Ready','Theatre 01'],['Laser assessment','Demo patient 094','09 Oct / 13:15','Consent review','Laser room'],['Post-operative review','Demo patient 103','09 Oct / 14:00','Ready','Room 02']]},attendance:{headers:['Employee','Shift','First punch','Last punch','Review'],rows:[['Demo employee 01','08:00 – 16:00','08:03','Not recorded','Open shift'],['Demo employee 02','08:00 – 16:00','08:24','Not recorded','Late arrival'],['Demo employee 03','09:00 – 17:00','08:56','Not recorded','Open shift'],['Demo employee 04','09:00 – 17:00','Missing','Missing','Missing punch']]},salary:{headers:['Employee','Base / EGP','Adjustments / EGP','Net / EGP','Period status'],rows:[['Demo employee 01','8,250.00','+350.00','8,600.00','Draft'],['Demo employee 02','7,400.00','−125.00','7,275.00','Needs review'],['Demo employee 03','9,100.00','+420.00','9,520.00','Draft'],['Demo employee 04','6,800.00','0.00','6,800.00','Draft']]},accounting:{headers:['Entry','Account','Description','Amount / EGP','Review'],rows:[['RC-0142','Patient receipts','Consultation receipt','650.00','Posted'],['EX-0081','Operating expenses','Supplies purchase','1,275.00','Draft'],['RC-0143','Patient receipts','Imaging receipt','1,150.00','Posted'],['JV-0026','Cash account','Daily reconciliation','2,450.00','Needs review']]},stockroom:{headers:['Item','Code','Available','Reorder level','Stock status'],rows:[['Demo sterile gloves','ST-001','46 boxes','20 boxes','Available'],['Demo eye drops','ST-014','8 packs','12 packs','Reorder'],['Demo lens packs','ST-031','23 units','10 units','Available'],['Demo dressing kit','ST-045','5 kits','8 kits','Reorder']]},reports:{headers:['Report','Scope','Period','Format','Availability'],rows:[['Patient flow','Current branch','09 October','Screen / print','Available'],['Attendance exceptions','Current branch','01–09 October','Screen / print','Available'],['Receipt register','Current branch','October 2026','Screen / print','Available'],['Payroll summary','Current branch','October 2026','Screen / print','Draft period']]}};
const titles={home:'Your working day',dashboard:'Today at the center',patients:'Patient register',bookings:'Appointment book',operations:'Operation lists',attendance:'Attendance review',salary:'Payroll workspace',accounting:'Accounting register',stockroom:'Stock register',reports:'Reports library',settings:'Workspace preferences'};
const contexts={home:['Start where you are needed','Open a patient record, review the queue, or move into a support workspace.','Next appointment','09:15 / Consultant review'],dashboard:['Needs attention','Two demo patients are waiting and one is ready for consultant review.','Queue coordination','Review the patient identity before moving the next record.'],patients:['Patient context','Open a row to review visit history, clinical notes, and the next action.','Record matching','Check the patient code before opening or updating a record.'],bookings:['Plan the day','Two demo appointment requests still need review.','Booking review','Confirm the requested service and room before confirming an appointment.'],operations:['Preparation checklist','One demo procedure requires a consent review.','Before the list starts','Review patient identity, procedure, and preparation status.'],attendance:['Exceptions first','One late arrival and one missing punch need review in this demo.','Punch review','Keep original punch times visible while reviewing the shift.'],salary:['Period review','October 2026 is a draft demo period. Nothing has been finalized.','Before finalization','Review attendance, advances, and manual adjustments.'],accounting:['Daily reconciliation','A draft expense and a reconciliation entry need review.','Entry context','Check account classification and the supporting document.'],stockroom:['Replenishment','Two demo items are below their reorder levels.','Inventory review','Review quantities and units before preparing a stock request.'],reports:['Choose a report','Select the period and scope before preparing a report.','Report scope','This preview shows synthetic records for the selected branch.'],settings:['Local preferences','Changes here affect only this preview and reset when you reload.','Preview only','No preferences are saved to the live application.']};
function escapeHtml(value){return String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function navMarkup(){return modules.map(([id,label])=>`<button data-page="${id}" ${page===id?'aria-current="page"':''}>${svg(id)}<span>${label}</span></button>`).join('');}
function brand(){return '<div class="brand"><span class="brand-symbol" aria-hidden="true">+</span><span class="brand-word">SELRS<small>Medical center workspace</small></span></div>';}
function updateUrl(){try{const url=new URL(location.href);url.searchParams.set('variant',direction);url.searchParams.set('page',page);history.replaceState(null,'',url);}catch{}}
function tell(message){document.querySelector('#toast').textContent=message;clearTimeout(toastTimer);toastTimer=setTimeout(()=>document.querySelector('#toast').textContent='',4500);}
function brief(){const values={home:[['5','appointments'],['2','booking reviews'],['2','attendance exceptions']],dashboard:[['2','waiting'],['1','in examination'],['1','ready for review']],patients:[['5','demo records'],['2','waiting']],bookings:[[String(bookings.length),'appointments'],[String(bookings.filter(r=>r[3]==='Pending review').length),'pending review']],operations:[['3','scheduled procedures'],['1','preparation review']],attendance:[['4','employees'],['2','exceptions']],salary:[['4','employees'],['32,195','net pay / EGP']],accounting:[['4','demo entries'],['2','need review']],stockroom:[['4','items'],['2','below reorder level']],reports:[['4','report templates'],['October','demo period']],settings:[['Local','preview settings']]};return `<div class="brief" aria-label="Demo summary">${values[page].map(([value,label])=>`<div class="brief-item"><strong class="num">${value}</strong><span>${label}</span></div>`).join('')}</div>`;}
function stateContent(){if(viewState==='empty')return '<div class="state-message"><h3>No records in this demo view</h3><p>The empty state has no matching records. Restore the sample data to continue comparing the design.</p><button class="primary" data-restore>Restore demo data</button></div>';if(viewState==='loading')return '<div class="state-message" role="status" aria-live="polite"><h3>Loading demo records</h3><p>This is a preview of the loading state, not a live request.</p><div class="loading-block"></div><div class="loading-block short"></div><button data-restore>Finish loading preview</button></div>';return '<div class="state-message" role="alert"><h3>Records could not be loaded</h3><p>This simulated connection error preserves the workspace context. Retry to restore the demo records.</p><button class="primary" data-restore>Retry</button></div>';}
function filtered(rows){return rows.filter(r=>r.join(' ').toLowerCase().includes(query.toLowerCase())&&(scope==='all'||r.some(x=>/review|missing|late|reorder|draft|waiting|unassigned/i.test(x))));}
function tableMarkup(headers,rows){const shown=filtered(rows);if(!shown.length)return '<div class="state-message"><h3>No matching records</h3><p>Try another search or remove the review filter.</p><button data-clear>Clear filters</button></div>';return `<div class="table-wrap"><table><thead><tr>${headers.map(h=>`<th scope="col">${h}</th>`).join('')}<th scope="col">Details</th></tr></thead><tbody>${shown.map(row=>`<tr>${row.map((cell,i)=>`<td data-label="${headers[i]}"><span class="${i===0?'identity':'num'}">${i===0?'<strong>'+escapeHtml(cell)+'</strong>':/review|missing|late|reorder|waiting|draft|confirmed|posted|ready|open shift/i.test(cell)?'<span class="status '+(/review|missing|late|reorder/i.test(cell)?'attention':'')+'">'+escapeHtml(cell)+'</span>':escapeHtml(cell)}</span></td>`).join('')}<td data-label="Details"><button class="row-open" data-record="${escapeHtml(row[0])}">Open</button></td></tr>`).join('')}</tbody></table></div>`;}
function agendaMarkup(){const shown=filtered(bookings);if(!shown.length)return tableMarkup([],[]);return `<div class="agenda">${shown.map(row=>`<article class="appointment"><span class="time">${row[0]}</span><div><strong>${escapeHtml(row[1])}</strong><small>${escapeHtml(row[2])} · ${escapeHtml(row[4])}</small><span class="status ${row[3]==='Pending review'?'attention':''}">${row[3]}</span></div><button class="row-open" data-record="${escapeHtml(row[1])}">View appointment</button></article>`).join('')}</div>`;}
function homeMarkup(){return `<div class="module-links">${modules.filter(m=>!['home','settings'].includes(m[0])).map(([id,label,description])=>`<button class="module-link" data-page="${id}">${svg(id)}<span><strong>${label}</strong><small>${description}</small></span></button>`).join('')}</div>`;}
function filters(){return `<div class="filters"><input type="search" id="record-search" aria-label="Search current records" placeholder="Search this workspace" value="${escapeHtml(query)}"><select id="scope" aria-label="Record filter"><option value="all" ${scope==='all'?'selected':''}>All records</option><option value="review" ${scope==='review'?'selected':''}>Requires attention</option></select><select id="view-state" aria-label="Preview data state"><option value="ready" ${viewState==='ready'?'selected':''}>Demo: populated</option><option value="empty" ${viewState==='empty'?'selected':''}>Demo: empty</option><option value="loading" ${viewState==='loading'?'selected':''}>Demo: loading</option><option value="error" ${viewState==='error'?'selected':''}>Demo: error</option></select></div>`;}
function settingsMarkup(){return '<form id="settings-form" class="settings-fields"><label>Default branch<select name="branch"><option>Tanta center</option><option>Kafr El Sheikh center</option></select><small>Changes the branch label in this local preview.</small></label><label>Preview notes<textarea name="notes" placeholder="Write your feedback on this direction"></textarea><small>Notes stay in this form only and are not saved.</small></label><button class="primary" type="submit">Apply preview preferences</button></form>';}
function primaryContent(){if(page==='home')return homeMarkup();const heading={dashboard:direction==='b'?'The patient daybook':'Active patient queue',patients:'Patient records',bookings:direction==='b'?'Friday, 9 October':'Appointments / 09 October',operations:'Scheduled procedures',attendance:'Today’s punch register',salary:'October 2026 / Draft period',accounting:'Entries / October 2026',stockroom:'Items and reorder levels',reports:'Available report templates',settings:'Display and workspace'}[page];let content;if(viewState!=='ready')content=stateContent();else if(page==='settings')content=settingsMarkup();else if(page==='bookings')content=direction==='c'?tableMarkup(['Time','Patient','Service','Status','Room'],bookings):agendaMarkup();else{const data=page==='dashboard'?tables.patients:tables[page];content=tableMarkup(data.headers,data.rows);}return `<section class="panel"><div class="panel-head"><div><h2>${heading}</h2><small>${escapeHtml(branch)} · Synthetic demo data</small></div><button data-refresh>Refresh preview</button></div>${page==='settings'?'':filters()}<div id="data-content">${content}</div><div class="split-line"><span>No live records or mutations</span><span>Preview / ${directions[direction].name}</span></div></section>`;}
function sideMarkup(){const c=contexts[page];return `<aside class="side-stack"><section class="panel note accent-note"><div class="eyeline">Working context</div><h2>${c[0]}</h2><p>${c[1]}</p><button data-page="${page==='home'?'dashboard':page==='bookings'?'patients':page==='salary'?'attendance':page==='stockroom'?'accounting':'bookings'}">${page==='home'?'Review patient queue':page==='bookings'?'Open patient register':page==='salary'?'Review attendance':page==='stockroom'?'Open accounting':'Open appointment book'}</button></section><section class="panel note"><h3>${c[2]}</h3><p>${c[3]}</p>${page==='bookings'||page==='home'?'<div class="mini-calendar" aria-label="Preview week"><span>Mon<br>5</span><span>Tue<br>6</span><span>Wed<br>7</span><span>Thu<br>8</span><span class="selected">Fri<br>9</span><span>Sat<br>10</span><span>Sun<br>11</span></div>':'<dl class="detail-list"><div><dt>Branch</dt><dd>'+escapeHtml(branch)+'</dd></div><div><dt>Period</dt><dd>October 2026</dd></div><div><dt>Data source</dt><dd>Demo only</dd></div></dl>'}</section></aside>`;}
function notesMarkup(){const d=directions[direction];return `<details class="design-notes"><summary>About direction ${direction.toUpperCase()}: ${d.name}</summary><p>${d.description}</p><dl><dt>Design dials</dt><dd>${d.dials}</dd><dt>Color</dt><dd>${d.color}</dd><dt>Layout</dt><dd>${d.layout}</dd><dt>Typography</dt><dd>${d.type}</dd><dt>Spacing</dt><dd>${d.spacing}</dd><dt>Identity motif</dt><dd>${d.motif}</dd><dt>Components</dt><dd>Registers support comparison; the context area holds next-step guidance. Icons identify existing module concepts. No illustrations or decorative charts.</dd><dt>Motion / depth</dt><dd>Pressed and hover feedback only. Only the comparison switcher has a shadow because it floats above the proposal.</dd></dl></details>`;}
function render(){document.body.dataset.design=direction;document.body.dataset.theme=theme;const nav=navMarkup();document.querySelector('#root').innerHTML=`<div class="shell"><aside class="sidebar">${brand()}<div><div class="nav-group-label">Center workspace</div><nav class="nav" aria-label="App modules">${nav}</nav></div><div class="sidebar-note">${escapeHtml(branch)}<br>Local design preview<br>No production connection</div></aside><div class="app"><header class="topbar"><div class="topbar-brand">${brand()}</div><input class="search" id="global-search" type="search" aria-label="Find a module" placeholder="Find a module and press Enter"><select class="branch" id="branch" aria-label="Preview branch"><option ${branch==='Tanta center'?'selected':''}>Tanta center</option><option ${branch==='Kafr El Sheikh center'?'selected':''}>Kafr El Sheikh center</option></select><button class="theme-button" id="theme">${theme==='light'?'Dark view':'Light view'}</button><span class="user" aria-label="Demo staff profile">DEMO</span></header><nav class="horizontal-nav" aria-label="App modules">${nav}</nav><div class="mobile-navigation"><label for="mobile-page">Workspace</label><select id="mobile-page">${modules.map(([id,label])=>`<option value="${id}" ${page===id?'selected':''}>${label}</option>`).join('')}</select></div><main id="main" class="workspace" tabindex="-1"><div class="breadcrumb">SELRS / ${escapeHtml(branch)} / ${modules.find(m=>m[0]===page)[1]}</div><div class="page-header"><div><h1>${titles[page]}</h1><p>${modules.find(m=>m[0]===page)[2]}</p></div><div class="page-actions"><button id="design-info">Design notes</button><button class="primary" data-new>${page==='bookings'?'New demo booking':page==='patients'?'New demo patient':page==='accounting'?'New demo entry':page==='stockroom'?'Demo stock request':page==='salary'?'Review demo period':page==='attendance'?'Review exceptions':page==='reports'?'Preview report':'New demo booking'}</button></div></div>${brief()}<div class="journal-note"><p>${page==='home'?'Begin with the patient in front of you. The rest of the center is one workspace away.':contexts[page][1]}</p></div><div class="console-strip"><strong>Attention / ${contexts[page][0]}</strong><span>${contexts[page][1]}</span></div><div class="work-grid"><div class="primary-work">${primaryContent()}</div>${sideMarkup()}</div>${notesMarkup()}</main></div></div>`;document.querySelectorAll('.direction-bar [data-design]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.design===direction)));updateUrl();}
function setPage(id){page=id;query='';scope='all';viewState='ready';render();window.scrollTo(0,0);}
function updateData(){const target=document.querySelector('#data-content');if(!target)return;if(viewState!=='ready')target.innerHTML=stateContent();else if(page==='bookings')target.innerHTML=direction==='c'?tableMarkup(['Time','Patient','Service','Status','Room'],bookings):agendaMarkup();else if(page==='settings')target.innerHTML=settingsMarkup();else{const data=page==='dashboard'?tables.patients:tables[page];target.innerHTML=tableMarkup(data.headers,data.rows);}}
function changeDirection(id){direction=id;render();tell(`Direction ${id.toUpperCase()}: ${directions[id].name}. Current module: ${page}.`);}
function cycle(delta){const keys=Object.keys(directions);changeDirection(keys[(keys.indexOf(direction)+delta+keys.length)%keys.length]);}
function openDialog(title,body){const dialog=document.querySelector('#dialog');dialog.innerHTML=`<div class="dialog-head"><h2 id="dialog-title">${escapeHtml(title)}</h2><button data-close aria-label="Close dialog">Close</button></div><div class="dialog-body">${body}</div>`;dialog.showModal();}
function openRecord(identity){let row=(page==='bookings'?bookings:page==='dashboard'?patientRows:tables[page]?.rows||[]).find(r=>r[0]===identity||r[1]===identity);if(!row)row=[identity];const headers=page==='bookings'?['Time','Patient','Service','Status','Room']:page==='dashboard'?tables.patients.headers:tables[page]?.headers||['Record'];openDialog('Demo record details',`<div class="profile"><div class="initials" aria-hidden="true">${page==='patients'||page==='bookings'||page==='dashboard'?'P':'R'}</div><div><h3>${escapeHtml(identity)}</h3><p>Synthetic record. Preview only.</p></div></div><dl class="detail-list">${row.map((value,i)=>`<div><dt>${headers[i]||'Detail'}</dt><dd>${escapeHtml(value)}</dd></div>`).join('')}</dl><div class="record-sections"><section><h3>Record notes</h3><p>This inspector demonstrates how identity, relevant details, and next actions can carry across modules.</p></section><section><h3>Available next step</h3><p>${page==='bookings'?'Confirm the service and room before reviewing this appointment.':'Review the selected record before opening its related workspace.'}</p></section></div><div class="dialog-actions"><button data-close>Back to register</button><button class="primary" data-demo-review>Mark reviewed in preview</button></div>`);}
function newBooking(){openDialog('New demo booking','<p>Create a local appointment to test the layout. Nothing is sent or saved to the app.</p><form id="booking-form"><label>Demo patient label<input name="patient" required placeholder="e.g. Demo patient 090"></label><label>Service<select name="service"><option>Consultant review</option><option>Refraction</option><option>Follow-up</option><option>Imaging</option></select></label><label>Appointment time<input name="time" type="time" required></label><label>Notes<textarea name="notes" placeholder="Preview notes only"></textarea></label><div class="dialog-actions"><button type="button" data-close>Cancel</button><button class="primary" type="submit">Add to demo book</button></div></form>');}
document.addEventListener('click',event=>{const button=event.target.closest('button');if(!button)return;if(button.dataset.page){setPage(button.dataset.page);return;}if(button.dataset.design){changeDirection(button.dataset.design);return;}if(button.dataset.cycle){cycle(Number(button.dataset.cycle));return;}if(button.id==='theme'){theme=theme==='light'?'dark':'light';render();return;}if(button.id==='design-info'){const details=document.querySelector('.design-notes');details.open=!details.open;if(details.open)details.scrollIntoView({block:'center',behavior:'instant'});return;}if(button.hasAttribute('data-record')){openRecord(button.dataset.record);return;}if(button.hasAttribute('data-close')){document.querySelector('#dialog').close();return;}if(button.hasAttribute('data-demo-review')){document.querySelector('#dialog').close();tell('Demo record marked reviewed for this preview. No live change.');return;}if(button.hasAttribute('data-restore')||button.hasAttribute('data-refresh')){viewState='ready';render();tell('Demo records restored. No network request was made.');return;}if(button.hasAttribute('data-clear')){query='';scope='all';render();return;}if(button.hasAttribute('data-new')){if(['home','dashboard','bookings','operations','settings'].includes(page))newBooking();else if(page==='patients')openDialog('New demo patient','<p>Test a minimal registration form. This creates preview feedback only, not a medical record.</p><form id="simple-form"><label>Demo patient label<input required placeholder="Demo patient label"></label><label>Record note<textarea placeholder="Preview notes only"></textarea></label><button class="primary">Preview registration</button></form>');else if(page==='accounting')openDialog('New demo accounting entry','<p>Preview only. No financial transaction will be posted.</p><form id="simple-form"><label>Account<select><option>Operating expenses</option><option>Patient receipts</option></select></label><label>Amount / EGP<input type="number" min="0.01" step="0.01" required></label><label>Description<input required></label><button class="primary">Preview draft entry</button></form>');else if(page==='stockroom')openDialog('Demo stock request','<p>Preview a replenishment request without changing stock quantities.</p><form id="simple-form"><label>Item<select><option>Demo eye drops</option><option>Demo dressing kit</option></select></label><label>Quantity<input type="number" min="1" required></label><button class="primary">Preview request</button></form>');else if(page==='attendance'){scope='review';render();}else if(page==='salary')openDialog('Review demo payroll period','<p>October 2026 / Draft. These amounts are synthetic examples, not a calculated payroll.</p><ol><li>Review attendance exceptions.</li><li>Check advances and adjustments.</li><li>Verify employee totals.</li></ol><div class="dialog-actions"><button data-close>Return to payroll</button><button data-page="attendance" data-close>Open attendance</button></div>');else if(page==='reports')openDialog('Demo report preview','<p>Patient flow / October 2026 / Synthetic sample</p>'+tableMarkup(tables.patients.headers,patientRows)+'<div class="dialog-actions"><button data-close>Close report</button></div>');}});
document.addEventListener('input',event=>{if(event.target.id==='record-search'){query=event.target.value;updateData();}});
document.addEventListener('change',event=>{if(event.target.id==='mobile-page')setPage(event.target.value);if(event.target.id==='branch'){branch=event.target.value;render();}if(event.target.id==='view-state'){viewState=event.target.value;updateData();}if(event.target.id==='scope'){scope=event.target.value;updateData();}});
document.addEventListener('keydown',event=>{if(event.target.id==='global-search'&&event.key==='Enter'){const match=modules.find(m=>m.join(' ').toLowerCase().includes(event.target.value.toLowerCase())&&event.target.value.trim());if(match)setPage(match[0]);else tell('No matching module. Try patients, bookings, or accounting.');}if(document.querySelector('#dialog').open||event.target.closest('input,textarea,select,[contenteditable]'))return;if(event.key==='ArrowLeft'||event.key==='ArrowRight'){event.preventDefault();cycle(event.key==='ArrowLeft'?-1:1);}});
document.addEventListener('submit',event=>{event.preventDefault();if(event.target.id==='booking-form'){const data=new FormData(event.target);bookings.push([data.get('time'),data.get('patient').trim(),data.get('service'),'Pending review','Unassigned']);bookings.sort((a,b)=>a[0].localeCompare(b[0]));document.querySelector('#dialog').close();setPage('bookings');tell('Added to the local demo book. Reloading clears this appointment.');}if(event.target.id==='simple-form'){document.querySelector('#dialog').close();tell('Preview validated. No live record was created.');}if(event.target.id==='settings-form'){const data=new FormData(event.target);branch=data.get('branch');render();tell('Preview preferences applied locally. Reloading resets them.');}});
document.querySelector('#dialog').addEventListener('click',event=>{const button=event.target.closest('[data-page]');if(button)document.querySelector('#dialog').close();});
render();
</script>
</body>
</html>
