<!doctype html>
<html lang="ar" dir="rtl">

  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#003D82" />
    <meta name="color-scheme" content="light" />
    <meta
      name="description"
      content="عيون الشروق — البوابة الطبية." />
    <link rel="dns-prefetch" href="//op.selrs.cc" />
    <link rel="preconnect" href="https://op.selrs.cc" crossorigin />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png?v=20260511" />
    <link rel="shortcut icon" href="/favicon.ico?v=20260511" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=20260511" />
    <link rel="manifest" href="/site.webmanifest?v=20260511" />
    <title>عيون الشروق</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <script>
      try {
        const dark = window.localStorage.getItem("theme") === "dark";
        document.documentElement.classList.toggle("dark", dark);
        document.documentElement.style.colorScheme = dark ? "dark" : "light";
      } catch {}
      try {
        if (window.Capacitor?.isNativePlatform?.()) {
          document.documentElement.classList.add("selrs-native-shell");
        }
      } catch {}
    </script>
    <style>
      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-items: center;
        overflow: hidden;
        background:
          radial-gradient(circle at top left, rgba(0, 61, 130, 0.08), transparent 34%),
          linear-gradient(180deg, #ffffff 0%, #e8f0f8 100%);
        transition: opacity 220ms ease, visibility 220ms ease;
      }

      #boot-splash.is-hidden {
        opacity: 0;
        visibility: hidden;
      }

      .boot-splash-logo-frame {
        position: relative;
        width: clamp(196px, 28vw, 248px);
        height: clamp(196px, 28vw, 248px);
        border-radius: 52px;
        border: 1px solid rgba(229, 231, 235, 0.95);
        background: linear-gradient(180deg, rgba(255, 255, 255, 0.98), rgba(232, 240, 248, 0.95));
        overflow: hidden;
        box-shadow: 0 16px 42px rgba(15, 23, 42, 0.08);
      }

      .boot-splash-logo-frame::before {
        content: "";
        position: absolute;
        inset: 0;
        background-image: url("/logos/full.png");
        background-position: center;
        background-repeat: no-repeat;
        background-size: clamp(138px, 20vw, 184px) clamp(138px, 20vw, 184px);
        will-change: clip-path, filter, opacity;
        animation: boot-lid-wipe 2.7s ease-in-out infinite;
      }

      @media (prefers-reduced-motion: reduce) {
        .boot-splash-logo-frame::before {
          animation: none;
        }
      }

      @keyframes boot-lid-wipe {
        0% {
          clip-path: ellipse(70% 5% at 50% 50%);
          opacity: 0.6;
          filter: blur(0.3px);
        }
        18% {
          clip-path: ellipse(72% 18% at 50% 50%);
          opacity: 0.86;
        }
        40% {
          clip-path: ellipse(72% 62% at 50% 50%);
          opacity: 1;
          filter: blur(0);
        }
        58% {
          clip-path: ellipse(72% 18% at 50% 50%);
          opacity: 0.86;
        }
        100% {
          clip-path: ellipse(70% 5% at 50% 50%);
          opacity: 0.6;
          filter: blur(0.3px);
        }
      }

      .selrs-native-shell #boot-splash {
        background: transparent;
      }

      .selrs-native-shell .boot-splash-logo-frame {
        width: clamp(180px, 46vw, 320px);
        height: clamp(180px, 46vw, 320px);
        border: 0;
        border-radius: 0;
        background: transparent;
        box-shadow: none;
        animation:
          boot-logo-open 720ms cubic-bezier(0.2, 0.9, 0.2, 1) both,
          boot-logo-breathe 1800ms ease-in-out 720ms infinite;
      }

      .selrs-native-shell .boot-splash-logo-frame::before {
        background-size: contain;
        animation: none;
      }

      @keyframes boot-logo-open {
        0% {
          opacity: 0;
          transform: scale(0.72);
        }
        62% {
          opacity: 1;
          transform: scale(1.05);
        }
        100% {
          opacity: 1;
          transform: scale(1);
        }
      }

      @keyframes boot-logo-breathe {
        0%, 100% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.035);
        }
      }

      html:not(.dark) #boot-splash {
        background:
          radial-gradient(circle at 0% 0%, rgba(6, 62, 148, 0.72), transparent 55%),
          radial-gradient(circle at 100% 0%, rgba(44, 94, 205, 0.45), transparent 50%),
          radial-gradient(circle at 100% 100%, rgba(214, 98, 22, 0.62), transparent 55%),
          radial-gradient(circle at 0% 100%, rgba(16, 128, 196, 0.4), transparent 50%),
          #f5f8fc;
      }

      html:not(.dark) .boot-splash-logo-frame {
        width: clamp(168px, 42vw, 232px);
        height: clamp(168px, 42vw, 232px);
        border: 1px solid rgba(255, 255, 255, 0.75);
        border-radius: 36px;
        background: rgba(207, 225, 248, 0.18);
        -webkit-backdrop-filter: blur(18px);
        backdrop-filter: blur(18px);
        box-shadow: 0 16px 42px rgba(0, 61, 130, 0.12), inset 0 1px rgba(255, 255, 255, 0.8);
      }

      html:not(.dark) .boot-splash-logo-frame::before {
        background-size: 76% auto;
      }

      html.dark #boot-splash {
        background:
          radial-gradient(circle at 0% 0%, rgba(6, 62, 148, 0.5), transparent 55%),
          radial-gradient(circle at 100% 100%, rgba(128, 62, 26, 0.3), transparent 55%),
          #0a1426;
      }

      html.dark .boot-splash-logo-frame {
        width: clamp(168px, 42vw, 232px);
        height: clamp(168px, 42vw, 232px);
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 36px;
        background: rgba(255, 255, 255, 0.1);
        -webkit-backdrop-filter: blur(18px);
        backdrop-filter: blur(18px);
        box-shadow: 0 16px 42px rgba(0, 0, 0, 0.25), inset 0 1px rgba(255, 255, 255, 0.12);
      }

      html.dark .boot-splash-logo-frame::before {
        background-size: 76% auto;
        background-image: url("/logos/full.png");
      }

      @media (prefers-reduced-motion: reduce) {
        .selrs-native-shell .boot-splash-logo-frame {
          animation: none;
        }
      }
    </style>
  </head>

  <body>
    <div id="boot-splash" aria-busy="true" aria-label="جاري تحميل واجهة النظام" role="status">
      <div class="boot-splash-logo-frame" aria-hidden="true"></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
</body>

</html>
